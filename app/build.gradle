plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.vedatbasboga.dicerollergame'
    compileSdk 37

    buildFeatures {
        compose true
        buildConfig true
    }

    defaultConfig {
        applicationId "com.vedatbasboga.dicerollergame"
        minSdk 28
        targetSdk 37
        versionCode 6
        versionName "1.0.1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "AD_APP_ID", "\"ca-app-pub-7900243709498260~9847863021\""
        buildConfigField "String", "AD_BANNER_HOME", "\"ca-app-pub-7900243709498260/5908618011\""
        buildConfigField "String", "AD_BANNER_ONE_DICE", "\"ca-app-pub-7900243709498260/1700891642\""
        buildConfigField "String", "AD_BANNER_TWO_DICE", "\"ca-app-pub-7900243709498260/5256993272\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Compose
    implementation platform("androidx.compose:compose-bom:2026.02.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.animation:animation"
    debugImplementation "androidx.compose.ui:ui-tooling"

    // Activity & Navigation
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'

    // Core
    implementation 'androidx.core:core-ktx:1.16.0'

    // Ads
    implementation 'com.google.android.gms:play-services-ads:24.4.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
